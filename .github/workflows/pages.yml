name: Deploy DocC to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DocC archive
        run: |
          xcrun docc convert Sources/BowlingWesternRealityKit.docc \
            --fallback-display-name BowlingWesternRealityKit \
            --fallback-bundle-identifier com.gentlemanleague.BowlingWesternRealityKit \
            --fallback-bundle-version 1.0.0 \
            --transform-for-static-hosting \
            --hosting-base-path 2026TechMap_tutorial \
            --output-path docs
          touch docs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
